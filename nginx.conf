# nginx는 location 안에 add_header가 하나라도 있으면 상위 add_header를 상속하지 않음
# → 보안 헤더를 각 location마다 반복 선언

# 네이버 블로그 RSS 프록시 캐시 (브라우저가 CORS 때문에 직접 못 가져오므로 서버가 중계)
proxy_cache_path /var/cache/nginx/blog levels=1 keys_zone=blog_rss:1m max_size=10m inactive=1h use_temp_path=off;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 압축
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # 정적 자산 캐시 (이미지/영상/폰트: 30일)
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|mp4|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CSS/JS: 1일
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML: 캐시 안 함 (수정 즉시 반영)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 네이버 블로그 최신 글 목록 (RSS) — 10분 캐시, 네이버 장애 시 캐시된 응답 유지
    location = /api/blog {
        proxy_pass https://rss.blog.naver.com/djnsc.xml;
        proxy_http_version 1.1;   # 네이버는 HTTP/1.0 요청에 426 응답
        proxy_ssl_server_name on;
        proxy_set_header Host rss.blog.naver.com;
        proxy_set_header User-Agent "djnsc.com blog widget";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache blog_rss;
        proxy_cache_key "naver-blog-rss";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=600";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 관리자 페이지 — 같은 Cloud Run 인스턴스의 사이드카(Node, 127.0.0.1:3000)로 프록시
    # ^~ : 아래 정규식 location(.css/.js/.html)보다 우선 적용
    location ^~ /admin {
        proxy_pass http://127.0.0.1:${ADMIN_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @admin_down;
    }
    location @admin_down {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 503 '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="3"><title>관리자 페이지 준비 중</title><p style="font-family:sans-serif;padding:40px">관리자 페이지를 준비하고 있습니다. 잠시 후 자동으로 다시 시도합니다.</p>';
    }

    # 빌드 관련 파일·관리자 소스는 노출 금지
    location ~ /(Dockerfile|nginx\.conf|DEPLOY\.md|\.git|package\.json) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
