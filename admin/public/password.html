<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>비밀번호 변경 | 도성학원 관리자</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="/admin/static/admin.css" />
</head>
<body class="auth">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="/images/logo_red.png" alt="" />
      <div><b>도성학원</b><small>ADMIN</small></div>
    </div>
    <h1>비밀번호 변경</h1>
    <p class="desc">관리자 페이지에 들어갈 때 쓰는 비밀번호입니다.</p>
    <div class="alert alert-info" data-if="notice">{{notice}}</div>
    <div class="alert alert-error" data-if="error">{{error}}</div>
    <form method="post" action="/admin/password" autocomplete="off">
      <label class="field"><span>현재 비밀번호</span><input type="password" name="current" autocomplete="current-password" required /></label>
      <label class="field"><span>새 비밀번호</span><input type="password" name="next" autocomplete="new-password" minlength="8" required /></label>
      <p class="pw-rules">8자 이상, 영문과 숫자를 모두 포함해 주세요.</p>
      <label class="field"><span>새 비밀번호 확인</span><input type="password" name="confirm" autocomplete="new-password" minlength="8" required /></label>
      <button class="btn btn-block" type="submit">변경하기</button>
    </form>
    <p class="auth-foot"><a href="/admin/">← 대시보드로</a></p>
  </main>
  <script>document.querySelectorAll('[data-if]').forEach(el => { if (!el.textContent.trim()) el.remove(); });</script>
</body>
</html>
