<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>도성학원 관리자 로그인</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="/admin/static/admin.css" />
</head>
<body class="auth">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="/images/logo_red.png" alt="" />
      <div><b>도성학원</b><small>ADMIN</small></div>
    </div>
    <h1>관리자 로그인</h1>
    <p class="desc">홈페이지 방문 통계와 유입경로를 확인합니다.</p>
    <div class="alert alert-error" data-if="error">{{error}}</div>
    <form method="post" action="/admin/login" autocomplete="off">
      <label class="field"><span>비밀번호</span><input type="password" name="password" autocomplete="current-password" autofocus required /></label>
      <button class="btn btn-block" type="submit">로그인</button>
    </form>
    <p class="auth-foot"><a href="/">← 홈페이지로</a></p>
  </main>
  <script>document.querySelectorAll('[data-if]').forEach(el => { if (!el.textContent.trim()) el.remove(); });</script>
</body>
</html>
