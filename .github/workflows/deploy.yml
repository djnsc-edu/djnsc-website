name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1            # 도쿄 리전 (Cloud Run 도메인 매핑 지원 리전; Artifact Registry는 서울)
  SERVICE: djnsc-website
  REPO: djnsc-website                # Artifact Registry 저장소 이름

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build and push images (web + admin)
        run: |
          AR="asia-northeast3-docker.pkg.dev/${PROJECT_ID}/${REPO}"
          WEB_IMAGE="${AR}/${SERVICE}:${GITHUB_SHA}"
          ADMIN_IMAGE="${AR}/${SERVICE}-admin:${GITHUB_SHA}"
          docker build --build-arg ASSET_VERSION="${GITHUB_SHA::8}" -t "$WEB_IMAGE" .
          docker build -t "$ADMIN_IMAGE" ./admin
          docker push "$WEB_IMAGE"
          docker push "$ADMIN_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
          echo "ADMIN_IMAGE=$ADMIN_IMAGE" >> "$GITHUB_ENV"

      # 한 서비스에 컨테이너 2개: web(nginx, 외부 포트 8080) + admin(Node, 127.0.0.1:3000 사이드카)
      # service.yaml 의 플레이스홀더를 치환한 뒤 전체 스펙을 교체(replace)한다.
      # (gcloud run deploy --container 방식은 기존의 이름 없는 컨테이너를 남겨 두어
      #  "exactly one container with an exposed port" 오류로 실패함)
      - name: Deploy to Cloud Run
        run: |
          sed -e "s|WEB_IMAGE_PLACEHOLDER|${WEB_IMAGE}|" \
              -e "s|ADMIN_IMAGE_PLACEHOLDER|${ADMIN_IMAGE}|" \
              -e "s|COMMIT_SHA_PLACEHOLDER|${GITHUB_SHA}|" \
              service.yaml > "${RUNNER_TEMP}/service.yaml"
          gcloud run services replace "${RUNNER_TEMP}/service.yaml" --region "$REGION" --quiet
          # 공개 접근 허용 (replace 는 IAM을 건드리지 않으므로 매번 보장)
          gcloud run services add-iam-policy-binding "$SERVICE" --region "$REGION" --quiet \
            --member allUsers --role roles/run.invoker
          echo "Deployed: $(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
